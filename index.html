            cursor: pointer;

        }

        .nav-item.open .nav-link-btn i.arrow {
            transform: rotate(180deg);
        }

        .dropdown-menu {
            display: none;
            position: absolute;
            top: calc(100% + 8px);
            right: 0;
            min-width: 240px;
            background-color: #ffffff;
            border: 1px solid #e5e7eb;

            .nav-item:hover .nav-link-btn i.arrow {

            to { opacity: 1; transform: translateY(0); }
