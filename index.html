<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NMA v2.63.78 - الرئيسية</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <style>
        :root {
            --primary-burgundy: #821437;
            --dark-burgundy: #680e2b;
            --light-burgundy-bg: #fdf6f8;
            --card-bg: #ffffff;
            --text-dark: #2c2c2c;
            --text-muted: #7a7a7a;
            --border-color: #ececec;
            --bg-color: #f8f9fa;
        }

        /* ================= ألوان الوضع الليلي (Dark Mode) ================= */
        body.dark-mode {
            --primary-burgundy: #a11f48;
            --dark-burgundy: #821437;
            --light-burgundy-bg: #2d1b22;
            --card-bg: #1e1e1e;
            --text-dark: #e5e7eb;
            --text-muted: #9ca3af;
            --border-color: #374151;
            --bg-color: #121212;
        }

        body.dark-mode .navbar { box-shadow: 0 2px 6px rgba(0,0,0,0.5); }
        body.dark-mode .welcome-card { background: linear-gradient(90deg, #1e1e24 0%, #2a2a35 60%, #1e1e1e 100%); }
        body.dark-mode .welcome-text h2, body.dark-mode .tasks-header h2 { color: #fff; }
        body.dark-mode .dropdown-menu { background-color: #1e1e1e; border-color: #374151; }
        body.dark-mode .dropdown-item { color: #e5e7eb; }
        body.dark-mode .dropdown-item:hover { background-color: #2d1b22; }
        body.dark-mode .data-table th { background: #2c2c2c; color: #e5e7eb; border-bottom-color: #444; }
        body.dark-mode .data-table td { border-bottom-color: #374151; color: #e5e7eb; }
        body.dark-mode .task-list-item { background: #1e1e1e; border-color: #374151; }
        body.dark-mode .task-list-item.selected { background: #2d1b22; border-color: var(--primary-burgundy); }
        body.dark-mode .task-details-col { background: #1e1e1e; border-color: #374151; }
        body.dark-mode .tasks-search-box input, body.dark-mode .search-input { background: #2c2c2c; color: #fff; border-color: #444; }
        body.dark-mode .tasks-filters-bar { background: #1e1e1e; border-color: #374151; }
        body.dark-mode .circle-stat { background: #2d1b22; border-color: #a11f48; color: #e5e7eb; }
        body.dark-mode .btn-outline { background: #2c2c2c; color: #e5e7eb; border-color: #444; }
        body.dark-mode .modal-box { background: #1e1e1e; color: #e5e7eb; border: 1px solid #374151; }
        body.dark-mode .modal-header { border-bottom-color: #374151; }
        body.dark-mode .close-modal { color: #e5e7eb; }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Tajawal', sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-dark); direction: rtl; transition: background-color 0.3s, color 0.3s; }

        /* ================= الشريط العلوي (Navbar) والقوائم ================= */
        .navbar { background-color: var(--primary-burgundy); color: #fff; height: 56px; padding: 0 24px; display: flex; align-items: center; justify-content: space-between; box-shadow: 0 2px 6px rgba(0,0,0,0.1); position: sticky; top: 0; z-index: 1000; transition: 0.3s; }
        .nav-right { display: flex; align-items: center; gap: 20px; }
        .brand { display: flex; align-items: center; gap: 10px; text-decoration: none; color: #fff; }
        .brand-logo { background: rgba(255,255,255,0.15); width: 34px; height: 34px; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 16px; }
        .brand-text { display: flex; flex-direction: column; line-height: 1.1; }
        .brand-text strong { font-size: 16px; font-weight: 800; letter-spacing: 0.5px; }
        .brand-text span { font-size: 10px; opacity: 0.8; }

        .nav-links { display: flex; align-items: center; gap: 6px; list-style: none; }
        .nav-item { position: relative; }
        .nav-link-btn { color: rgba(255,255,255,0.92); text-decoration: none; padding: 7px 14px; border-radius: 8px; font-size: 14px; font-weight: 500; display: flex; align-items: center; gap: 7px; transition: 0.2s; cursor: pointer; border: 1.5px solid transparent; background: transparent; }
        .nav-link-btn:hover, .nav-item.open .nav-link-btn { background-color: rgba(255,255,255,0.15); color: #fff; }
        .nav-link-btn.active { background-color: rgba(255,255,255,0.22); font-weight: 700; color: #fff; }
        .nav-link-btn i.arrow { font-size: 11px; transition: transform 0.2s ease; }
        .nav-item.open .nav-link-btn i.arrow { transform: rotate(180deg); }

        .dropdown-menu { display: none; position: absolute; top: calc(100% + 8px); right: 0; min-width: 240px; background-color: var(--card-bg); border: 1px solid var(--border-color); border-radius: 12px; box-shadow: 0 10px 25px rgba(0, 0, 0, 0.14); padding: 8px; z-index: 1500; animation: dropdownFade 0.18s ease; max-height: 85vh; overflow-y: auto; }
        .nav-item.open .dropdown-menu { display: block; }
        @media (min-width: 769px) { .nav-item:hover .dropdown-menu { display: block; } .nav-item:hover .nav-link-btn i.arrow { transform: rotate(180deg); } }
        @keyframes dropdownFade { from { opacity: 0; transform: translateY(-6px); } to { opacity: 1; transform: translateY(0); } }

        .dropdown-section-label { font-size: 11px; font-weight: 700; color: var(--text-muted); padding: 6px 12px 4px; margin-top: 2px; }
        .dropdown-item { display: flex; align-items: center; justify-content: space-between; padding: 9px 12px; color: var(--text-dark); text-decoration: none; font-size: 13.5px; font-weight: 500; border-radius: 8px; transition: 0.15s; }
        .dropdown-item-right { display: flex; align-items: center; gap: 10px; }
        .dropdown-item i { width: 18px; text-align: center; color: var(--primary-burgundy); font-size: 13.5px; }
        .dropdown-item:hover { background-color: var(--light-burgundy-bg); color: var(--primary-burgundy); font-weight: 700; }
        .dropdown-divider { height: 1px; background-color: var(--border-color); margin: 6px 0; }

        .nav-left { display: flex; align-items: center; gap: 18px; }
        .notification-wrapper, .profile-wrapper { position: relative; }
        .notification-btn { position: relative; cursor: pointer; font-size: 18px; color: #fff; padding: 6px; transition: 0.2s; }
        .notification-btn:hover { transform: scale(1.1); }
        .notification-badge { position: absolute; top: 0; right: -4px; background-color: #e53935; color: #fff; font-size: 10px; font-weight: 700; padding: 1px 5px; border-radius: 10px; border: 1.5px solid var(--primary-burgundy); }
        .user-profile { display: flex; align-items: center; gap: 10px; cursor: pointer; padding: 4px 10px; border-radius: 8px; transition: 0.2s; }
        .user-profile:hover { background: rgba(255,255,255,0.1); }
        .user-avatar { width: 32px; height: 32px; border-radius: 50%; background: rgba(255,255,255,0.2); display: flex; align-items: center; justify-content: center; font-size: 14px; }
        .user-info { display: flex; flex-direction: column; text-align: right; line-height: 1.2; }
        .user-info strong { font-size: 13px; font-weight: 700; }
        .user-info span { font-size: 11px; opacity: 0.8; }
        .left-dropdown { left: 0; right: auto; min-width: 280px; }

        /* ================= مسار الصفحة والحاوية ================= */
        .breadcrumb-bar { background-color: var(--card-bg); padding: 10px 24px; border-bottom: 1px solid var(--border-color); font-size: 13px; color: var(--text-muted); display: flex; align-items: center; justify-content: space-between; transition: 0.3s; }
        .breadcrumb-links { display: flex; align-items: center; gap: 8px; }
        .breadcrumb-bar span.current { color: var(--primary-burgundy); font-weight: 700; }
        .back-home-btn { display: none; background: var(--light-burgundy-bg); color: var(--primary-burgundy); border: 1px solid var(--border-color); padding: 4px 12px; border-radius: 6px; font-size: 12.5px; font-weight: 700; cursor: pointer; align-items: center; gap: 6px; transition: 0.2s; }
        .back-home-btn:hover { background: var(--primary-burgundy); color: #fff; }
        .container { max-width: 1600px; margin: 0 auto; padding: 18px 24px 40px; }

        /* ================= الشاشة الرئيسية ================= */
        .welcome-card { background: linear-gradient(90deg, #f3f5fc 0%, #f8f9fc 60%, #ffffff 100%); border: 1px solid var(--border-color); border-radius: 12px; padding: 16px 22px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 18px; transition: 0.3s; }
        .welcome-right { display: flex; align-items: center; gap: 16px; }
        .moon-icon-box { width: 46px; height: 46px; border-radius: 50%; background-color: #e4e9fb; color: #4a6cf7; display: flex; align-items: center; justify-content: center; font-size: 20px; }
        .welcome-text h2 { font-size: 18px; font-weight: 800; color: var(--text-dark); margin-bottom: 3px; }
        .welcome-text p { font-size: 13.5px; color: var(--text-muted); }
        .welcome-left { display: flex; align-items: center; gap: 14px; }
        .date-box { text-align: left; line-height: 1.3; }
        .date-box .greeting { color: #3b82f6; font-weight: 700; font-size: 13.5px; display: block; }
        .date-box .date-str { color: var(--text-muted); font-size: 12px; }
        .refresh-btn { background: transparent; border: none; color: var(--text-muted); font-size: 16px; cursor: pointer; padding: 8px; border-radius: 50%; transition: 0.3s; }
        .refresh-btn:hover { background-color: var(--border-color); transform: rotate(180deg); }

        .announcement-banner { background: linear-gradient(105deg, #630c28 0%, #861439 55%, #751030 100%); border-radius: 14px; padding: 20px 28px; color: #fff; display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; position: relative; overflow: hidden; box-shadow: 0 4px 15px rgba(130, 20, 55, 0.18); }
        .banner-right { flex: 1; z-index: 2; }
        .banner-badges { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; font-size: 13px; }
        .banner-category { display: flex; align-items: center; gap: 6px; font-weight: 700; opacity: 0.95; }
        .badge-pill { padding: 3px 10px; border-radius: 20px; font-size: 11.5px; font-weight: 700; display: inline-flex; align-items: center; gap: 4px; }
        .badge-important { background-color: rgba(255, 255, 255, 0.18); border: 1px solid rgba(255, 255, 255, 0.35); color: #fff; }
        .badge-pinned { background-color: rgba(234, 179, 8, 0.25); border: 1px solid rgba(250, 204, 21, 0.5); color: #fef08a; }
        .banner-title { font-size: 21px; font-weight: 800; margin-bottom: 8px; display: flex; align-items: center; gap: 8px; }
        .banner-desc { font-size: 14px; line-height: 1.6; color: rgba(255, 255, 255, 0.9); max-width: 650px; margin-bottom: 16px; }
        .banner-meta { font-size: 12.5px; color: rgba(255, 255, 255, 0.85); display: flex; align-items: center; gap: 6px; }
        .banner-left { display: flex; align-items: center; gap: 24px; z-index: 2; }
        .banner-promo-info { text-align: center; display: flex; flex-direction: column; align-items: center; gap: 10px; }
        .promo-sub-tag { font-size: 11px; background: rgba(255,255,255,0.12); padding: 3px 10px; border-radius: 6px; }
        .promo-heading { font-size: 18px; font-weight: 800; color: rgba(255,255,255,0.85); }
        .promo-features { display: flex; gap: 6px; flex-wrap: wrap; justify-content: center; }
        .promo-chip { background: rgba(0,0,0,0.22); border: 1px solid rgba(255,255,255,0.15); padding: 4px 9px; border-radius: 6px; font-size: 11px; display: flex; align-items: center; gap: 4px; }
        .banner-actions { display: flex; flex-direction: column; align-items: flex-end; justify-content: space-between; height: 150px; }
        .read-more-btn { background-color: #fff; color: var(--primary-burgundy); border: none; padding: 9px 18px; border-radius: 8px; font-size: 13.5px; font-weight: 700; cursor: pointer; display: inline-flex; align-items: center; gap: 8px; transition: 0.2s; }
        
        .section-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; margin-top: 8px; }
        .section-title { display: flex; align-items: center; gap: 8px; font-size: 16px; font-weight: 800; color: var(--text-dark); }
        .section-title i { color: var(--primary-burgundy); font-size: 16px; }

        .cards-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 16px; margin-bottom: 26px; }
        .stat-card { background-color: var(--card-bg); border: 1px solid var(--border-color); border-radius: 12px; padding: 16px 18px; transition: 0.3s; cursor: pointer; display: flex; flex-direction: column; justify-content: space-between; min-height: 118px; }
        .stat-card:hover { transform: translateY(-2px); border-color: var(--primary-burgundy); }
        .card-top { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
        .card-icon { width: 32px; height: 32px; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 14px; flex-shrink: 0; }
        .card-title { font-size: 13.5px; font-weight: 700; color: var(--text-dark); }
        .card-value { font-size: 21px; font-weight: 800; line-height: 1.2; margin-bottom: 4px; }
        .card-sub { font-size: 11.5px; color: var(--text-muted); line-height: 1.4; }

        .icon-red { background: #fde8e8; color: #d93025; } .val-red { color: #d93025; }
        .icon-orange { background: #fef3c7; color: #d97706; } .val-orange { color: #d97706; }
        .icon-coral { background: #ffedd5; color: #e06c53; } .val-coral { color: #e06c53; }
        .icon-teal { background: #ccfbf1; color: #0f766e; } .val-teal { color: #0f766e; }
        .icon-burgundy { background: #fce7f3; color: #821437; } .val-burgundy { color: #821437; }
        .icon-pink { background: #fae8ff; color: #a21caf; } .val-pink { color: #a21caf; }

        /* ================= الصفحات الفرعية والخيارات ================= */
        #subpageView { display: none; animation: fadeIn 0.2s ease; }
        .subpage-card { background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 14px; padding: 22px 26px; transition: 0.3s; }
        .subpage-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border-color); padding-bottom: 16px; margin-bottom: 20px; flex-wrap: wrap; gap: 15px; }
        .subpage-title { display: flex; align-items: center; gap: 12px; }
        .subpage-title .icon-box { width: 42px; height: 42px; border-radius: 10px; background: var(--light-burgundy-bg); color: var(--primary-burgundy); display: flex; align-items: center; justify-content: center; font-size: 18px; }
        .subpage-title h2 { font-size: 19px; font-weight: 800; color: var(--text-dark); }
        .subpage-title p { font-size: 13px; color: var(--text-muted); }
        
        .toolbar-actions { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
        .search-input { padding: 8px 14px; border: 1px solid var(--border-color); border-radius: 8px; font-size: 13.5px; min-width: 240px; outline: none; background: var(--card-bg); color: var(--text-dark); }
        .btn-primary { background: var(--primary-burgundy); color: #fff; border: none; padding: 8px 16px; border-radius: 8px; font-size: 13.5px; font-weight: 700; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; transition: 0.2s; }
        .btn-primary:hover { background: var(--dark-burgundy); }
        .btn-outline { background: var(--card-bg); color: var(--text-dark); border: 1px solid var(--border-color); padding: 7px 14px; border-radius: 8px; font-size: 13px; font-weight: 700; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; transition: 0.2s; }
        .btn-outline:hover { border-color: var(--primary-burgundy); }
        
        .data-table { width: 100%; border-collapse: collapse; font-size: 13.5px; }
        .data-table th { background: var(--bg-color); color: var(--text-muted); font-weight: 700; text-align: right; padding: 12px 14px; border-bottom: 1px solid var(--border-color); }
        .data-table td { padding: 12px 14px; border-bottom: 1px solid var(--border-color); color: var(--text-dark); }
        .status-tag { padding: 3px 10px; border-radius: 20px; font-size: 11.5px; font-weight: 700; display: inline-block; }
        .status-active { background: #dcfce7; color: #15803d; }
        .status-warning { background: #fef3c7; color: #b45309; }
        .status-danger { background: #fee2e2; color: #b91c1c; }
        .qty-input { width: 65px; padding: 4px 8px; border: 1px solid var(--border-color); border-radius: 6px; text-align: center; font-weight: 700; background: var(--card-bg); color: var(--text-dark); }

        /* ================= صفحة مهامي الجديدة ================= */
        .tasks-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 24px; padding-bottom: 16px; border-bottom: 1px solid var(--border-color); }
        .tasks-header h2 { font-size: 24px; font-weight: 800; color: var(--text-dark); margin-bottom: 4px; }
        .tasks-header p { font-size: 13px; color: var(--text-muted); }
        .tasks-search-box { position: relative; width: 300px; }
        .tasks-search-box input { width: 100%; padding: 10px 35px 10px 14px; border: 1px solid var(--border-color); border-radius: 8px; font-size: 13px; outline: none; background: var(--card-bg); color: var(--text-dark); }
        .tasks-search-box i { position: absolute; right: 12px; top: 12px; color: var(--text-muted); font-size: 14px; }
        .tasks-filters-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; background: var(--card-bg); padding: 12px 20px; border-radius: 12px; border: 1px solid var(--border-color); }
        .stats-group { display: flex; align-items: center; gap: 16px; }
        .circle-stat { width: 44px; height: 44px; border-radius: 50%; border: 3px solid #fce7f3; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 800; color: var(--text-dark); background: var(--light-burgundy-bg); }
        .stats-text { font-size: 12.5px; color: var(--text-muted); line-height: 1.4; }
        .stats-text strong { color: var(--text-dark); display: block; }
        .filter-chips { display: flex; gap: 10px; margin-right: 20px; border-right: 1px solid var(--border-color); padding-right: 20px; }
        .chip { padding: 6px 14px; border-radius: 20px; font-size: 12.5px; font-weight: 700; display: flex; align-items: center; gap: 6px; cursor: pointer; border: 1px solid transparent; }
        .chip-pink { background: #fde8e8; color: #d93025; }
        .chip-gray { background: var(--bg-color); color: var(--text-muted); border-color: var(--border-color); }
        .tasks-actions { display: flex; align-items: center; gap: 16px; color: var(--text-muted); font-size: 13.5px; }
        .tasks-layout { display: flex; gap: 24px; align-items: flex-start; }
        .tasks-list-col { flex: 1; display: flex; flex-direction: column; gap: 16px; }
        .tasks-list-header { border-bottom: 2px solid #fca5a5; padding-bottom: 8px; margin-bottom: 4px; }
        .tasks-list-header span { color: #d93025; font-size: 13.5px; font-weight: 800; display: flex; align-items: center; gap: 6px; }
        .task-list-item { background: var(--card-bg); padding: 16px; border: 1px solid var(--border-color); border-radius: 10px; display: flex; justify-content: space-between; align-items: flex-start; cursor: pointer; border-right: 3px solid transparent; }
        .task-list-item.selected { border-right-color: var(--primary-burgundy); background: var(--light-burgundy-bg); border-color: var(--primary-burgundy); }
        .task-list-item-right { display: flex; gap: 12px; align-items: flex-start; }
        .task-list-item-info h4 { font-size: 14px; font-weight: 700; color: var(--text-dark); margin-bottom: 6px; line-height: 1.4; }
        .task-list-item-info h4.done { text-decoration: line-through; color: var(--text-muted); }
        .priority-flag { font-size: 11px; color: #d93025; display: flex; align-items: center; gap: 4px; }
        .task-list-item-left { font-size: 12px; color: #0f766e; font-weight: 500; }
        .task-details-col { width: 340px; background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 14px; padding: 24px; flex-shrink: 0; }
        .details-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
        .status-pill-green { background: #dcfce7; color: #15803d; padding: 4px 12px; border-radius: 20px; font-size: 12px; font-weight: 800; }
        .task-details-col h3 { font-size: 17px; font-weight: 800; color: var(--text-dark); margin-bottom: 20px; line-height: 1.4; }
        .details-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px 10px; margin-bottom: 20px; text-align: right; }
        .details-grid div { display: flex; flex-direction: column; gap: 4px; }
        .lbl-sm { font-size: 11.5px; color: var(--text-muted); }
        .val-sm { font-size: 13px; font-weight: 700; color: var(--text-dark); }
        .meta-row { margin-bottom: 16px; }
        .btn-burgundy-full { width: 100%; background: var(--primary-burgundy); color: #fff; border: none; padding: 10px; border-radius: 8px; font-size: 14px; font-weight: 700; cursor: pointer; display: flex; justify-content: center; align-items: center; gap: 8px; margin: 20px 0; }
        .desc-box { margin-bottom: 24px; }
        .desc-box h4 { font-size: 13px; color: var(--text-muted); margin-bottom: 8px; }
        .desc-box p { font-size: 13px; color: var(--text-dark); line-height: 1.7; }

        /* Toast & Modal */
        .toast-msg { position: fixed; bottom: 24px; left: 24px; background: var(--primary-burgundy); color: #fff; padding: 12px 20px; border-radius: 10px; font-size: 13.5px; font-weight: 700; box-shadow: 0 8px 20px rgba(0,0,0,0.2); display: none; align-items: center; gap: 10px; z-index: 3000; }
        .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.7); z-index: 2000; align-items: center; justify-content: center; }
        .modal-box { background: var(--card-bg); border-radius: 14px; width: 90%; max-width: 500px; padding: 24px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        .modal-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border-color); padding-bottom: 12px; margin-bottom: 14px; }
